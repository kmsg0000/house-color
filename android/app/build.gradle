plugins {
    id 'com.android.application'
}

android {
    namespace 'kr.housecolor.app'
    compileSdk 35

    defaultConfig {
        applicationId 'kr.housecolor.app'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
    }

    // 서명 키는 저장소에 두지 않는다. GitHub Secrets → CI 가 환경변수로 넘긴다.
    //   ANDROID_KEYSTORE_PATH, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS (키 비밀번호는 저장소 비밀번호와 같게 생성)
    def ksPath = System.getenv('ANDROID_KEYSTORE_PATH')
    signingConfigs {
        if (ksPath) {
            rel {
                storeFile file(ksPath)
                storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                keyAlias System.getenv('ANDROID_KEY_ALIAS')
                keyPassword System.getenv('ANDROID_KEY_PASSWORD') ?: System.getenv('ANDROID_KEYSTORE_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            // 키가 없으면 서명하지 않은 release 를 만들지 않도록 CI 에서 debug 빌드로 대체한다
            if (ksPath) signingConfig signingConfigs.rel
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // kotlin-stdlib 버전 충돌(jdk7/jdk8 중복 클래스) 방지
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.webkit:webkit:1.12.1'
}
